name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Node versions here are the ones `engines` claims support for.
# Keep the two in step.
jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build no longer typechecks tests, so this has to run alongside it.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm vitest run --coverage

      - name: Build
        run: pnpm build

      # Packs and installs the tarball, then runs the bin through the symlink
      # npm creates. Catches packaging faults the unit suite cannot see.
      - name: Packaging smoke test
        run: pnpm test:pack

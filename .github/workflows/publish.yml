name: Publish

# Publishes to npm when a version tag is pushed, for example:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Authenticates by npm trusted publishing (OIDC), so there is no token to
# store or rotate. npm is configured to trust this repository and this
# workflow file by name, so renaming this file breaks publishing until the
# trusted publisher entry on npmjs.com is updated to match.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for trusted publishing: lets the runner mint the OIDC token npm
  # authenticates with. Without it the publish fails with an auth error.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles a new
      # enough npm, but fail with a clear message rather than a confusing auth
      # error if that ever stops being true.
      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          installed="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing, 11.5.1 or later is required`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$installed"

      - run: pnpm install --frozen-lockfile

      # Publishing a tag that disagrees with package.json produces a release
      # nobody can find, so stop before that happens rather than after.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${declared}"
            exit 1
          fi
          echo "Publishing ${declared}"

      # The same gates CI runs. A tag should never be the first time these fail.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm vitest run

      - name: Build
        run: pnpm build

      # Packs and installs the tarball, so the artefact about to be published is
      # the one that gets checked.
      - name: Packaging smoke test
        run: pnpm test:pack

      # A prerelease must not become the version `npm install node-rdap` gives
      # people, so it goes out under the `next` tag instead of `latest`.
      - name: Choose the dist-tag
        id: disttag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Prerelease: publishing under the 'next' tag"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable: publishing under the 'latest' tag"
          fi

      # No token and no --provenance flag: trusted publishing authenticates over
      # OIDC and attaches provenance attestations by itself.
      - name: Publish
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
